<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · 小林科技</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4efe4">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f4efe4;color:#17130f;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(23,19,15,.05) 1px,transparent 1px);background-size:22px 22px;opacity:.5}
  .card{position:relative;text-align:center;padding:48px 36px;max-width:560px}
  .seal{display:inline-grid;place-items:center;width:54px;height:54px;background:#b7351f;color:#f4efe4;
    font-family:"Noto Serif SC","Songti SC",SimSun,serif;font-size:28px;font-weight:700;margin-bottom:26px}
  .code{font-family:Consolas,monospace;font-size:12px;letter-spacing:.32em;color:#6d655a}
  h1{font-family:"Noto Serif SC","Songti SC",SimSun,serif;font-size:clamp(38px,8vw,62px);line-height:1.15;
    letter-spacing:-.01em;margin:16px 0 14px;font-weight:700}
  h1 span{color:#b7351f}
  p{color:#57504a;font-size:14px;line-height:1.9;margin:0 0 28px}
  a{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:2px;color:#fff;
    background:#b7351f;font-weight:600;font-size:14px;text-decoration:none}
  a:hover{background:#8f2a17}
  .rule{width:56px;height:2px;background:#b7351f;margin:0 auto 26px}
</style>
</head>
<body>
  <main class="card">
    <div class="seal">林</div>
    <div class="code">404 / NOT FOUND</div>
    <h1>这一页<span>写丢了</span>。</h1>
    <div class="rule"></div>
    <p>可能是链接写错了，也可能是这个页面还没做。<br>回首页看看能做什么，或者直接微信找小林。</p>
    <a href="./">← 回到小林科技</a>
  </main>
</body>
</html>
